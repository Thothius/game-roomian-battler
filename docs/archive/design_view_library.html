<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GungeonMate — Design View Library</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #1a1a22;
    --border: #2a2a35;
    --accent: #b480ff;
    --accent-glow: rgba(180, 128, 255, 0.3);
    --text: #e0e0e8;
    --text-dim: #8888a0;
    --gold: #ffd54f;
    --cyan: #4fc3f7;
    --green: #66bb6a;
    --pink: #ff5252;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    padding: 0;
  }
  /* Header */
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
    border-bottom: 2px solid var(--accent);
    padding: 28px 40px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .header h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .subtitle {
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 4px;
    letter-spacing: 0.5px;
  }
  .header .meta {
    display: flex;
    gap: 24px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .header .meta-item {
    font-size: 12px;
    color: var(--text-dim);
  }
  .header .meta-item strong {
    color: var(--accent);
    font-weight: 700;
  }
  /* Filter bar */
  .filter-bar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 40px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    position: sticky;
    top: 89px;
    z-index: 99;
  }
  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .filter-btn:hover {
    border-color: var(--accent);
    color: var(--text);
  }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 12px var(--accent-glow);
  }
  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    padding: 30px 40px;
    max-width: 1600px;
    margin: 0 auto;
  }
  @media (max-width: 1200px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  /* Card */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-4px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 20px var(--accent-glow);
  }
  .card-image {
    width: 100%;
    aspect-ratio: 420/900;
    background: #000;
    overflow: hidden;
    position: relative;
  }
  .card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s;
  }
  .card:hover .card-image img {
    transform: scale(1.02);
  }
  .card-overlay {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.8);
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .card-body {
    padding: 12px 16px 16px;
  }
  .card-number {
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 700;
    letter-spacing: 1px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-top: 2px;
  }
  .card-desc {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
    line-height: 1.4;
  }
  /* Category colors */
  .cat-home { color: var(--accent); }
  .cat-character { color: var(--gold); }
  .cat-run { color: var(--cyan); }
  .cat-browse { color: var(--green); }
  .cat-settings { color: var(--pink); }
  .cat-codex { color: var(--accent); }
  .cat-multiplayer { color: var(--gold); }
  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 40px;
  }
  .lightbox.active {
    display: flex;
  }
  .lightbox-img {
    max-width: 90%;
    max-height: 85vh;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
    border: 1px solid var(--border);
  }
  .lightbox-title {
    color: var(--text);
    font-size: 18px;
    font-weight: 700;
    margin-top: 16px;
    letter-spacing: 1px;
  }
  .lightbox-desc {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 4px;
  }
  .lightbox-close {
    position: absolute;
    top: 20px; right: 30px;
    font-size: 32px;
    color: var(--text-dim);
    cursor: pointer;
    transition: color 0.2s;
    background: none;
    border: none;
  }
  .lightbox-close:hover { color: var(--pink); }
  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 36px;
    color: var(--text-dim);
    cursor: pointer;
    background: none;
    border: none;
    padding: 20px;
    transition: color 0.2s;
  }
  .lightbox-nav:hover { color: var(--accent); }
  .lightbox-prev { left: 10px; }
  .lightbox-next { right: 10px; }
  /* Footer */
  .footer {
    text-align: center;
    padding: 30px;
    color: var(--text-dim);
    font-size: 12px;
    border-top: 1px solid var(--border);
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>GUNGEON MATE — DESIGN VIEW LIBRARY</h1>
  <div class="subtitle">Interactive screenshot gallery of all major app screens</div>
  <div class="meta">
    <div class="meta-item">Version: <strong>v1.9.25</strong></div>
    <div class="meta-item">Screens: <strong>28</strong></div>
    <div class="meta-item">Captured: <strong>Aug 2026</strong></div>
    <div class="meta-item">Viewport: <strong>420×900 (mobile portrait)</strong></div>
  </div>
</div>

<div class="filter-bar">
  <button class="filter-btn active" data-filter="all">ALL</button>
  <button class="filter-btn" data-filter="home">HOME</button>
  <button class="filter-btn" data-filter="character">CHARACTER</button>
  <button class="filter-btn" data-filter="run">ACTIVE RUN</button>
  <button class="filter-btn" data-filter="browse">BROWSE</button>
  <button class="filter-btn" data-filter="settings">SETTINGS</button>
  <button class="filter-btn" data-filter="codex">CODEX</button>
  <button class="filter-btn" data-filter="multiplayer">MULTIPLAYER</button>
</div>

<div class="grid" id="grid"></div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <button class="lightbox-nav lightbox-prev" onclick="navLightbox(-1)">&#8249;</button>
  <img class="lightbox-img" id="lightbox-img" src="">
  <div class="lightbox-title" id="lightbox-title"></div>
  <div class="lightbox-desc" id="lightbox-desc"></div>
  <button class="lightbox-nav lightbox-next" onclick="navLightbox(1)">&#8250;</button>
</div>

<div class="footer">
  GungeonMate v1.9.25 — Design View Library — 28 screens — Generated via Playwright browser automation
</div>

<script>
const screens = [
  { id: 1, file: "screenshots/01_home_screen.png", title: "Home / Main Menu", cat: "home", catLabel: "HOME", desc: "App launch screen with vortex video background, title, Local Run & Multiplayer buttons, version tag" },
  { id: 2, file: "screenshots/02_character_select.png", title: "Character Select", cat: "character", catLabel: "CHARACTER", desc: "3×3 grid of all 9 gungeoneers — Marine, Pilot, Convict, Hunter, Bullet, Robot, Cultist, Paradox, Gunslinger" },
  { id: 3, file: "screenshots/03_active_run.png", title: "Active Run", cat: "run", catLabel: "ACTIVE RUN", desc: "Main gameplay screen — gungeoneer header, stats dashboard, guns/items panels, tab navigation" },
  { id: 4, file: "screenshots/04_shrine_picker.png", title: "Shrine Picker", cat: "run", catLabel: "ACTIVE RUN", desc: "Browse and use shrines — Cleanse, Ammo, Fallen Angel, Beholster, Blank, Blood, Challenge, Companion" },
  { id: 5, file: "screenshots/05_browse_guns.png", title: "Browse — Guns", cat: "browse", catLabel: "BROWSE", desc: "Gun browsing tab with search, quality-tier sorting, and gun cards with stats" },
  { id: 6, file: "screenshots/06_browse_items.png", title: "Browse — Items", cat: "browse", catLabel: "BROWSE", desc: "Item browsing tab with S-tier items, quality badges, synergy counts" },
  { id: 7, file: "screenshots/07_item_detail.png", title: "Item Detail", cat: "browse", catLabel: "BROWSE", desc: "Detailed item view — Baby Good Shelleton with full effect text, stats, synergies" },
  { id: 8, file: "screenshots/08_settings.png", title: "Settings — Appearance", cat: "settings", catLabel: "SETTINGS", desc: "Theme palette selection, font controls, glow settings, inventory layout options" },
  { id: 9, file: "screenshots/09_theme_picker.png", title: "Theme Picker (Minimalist)", cat: "settings", catLabel: "SETTINGS", desc: "Full theme carousel — Minimalist active, with palette variants, particle presets, color schema, speed controls" },
  { id: 10, file: "screenshots/10_settings_gameplay.png", title: "Settings — Gameplay", cat: "settings", catLabel: "SETTINGS", desc: "Gameplay settings — dice roll animation, dialogue options, gameplay preferences" },
  { id: 11, file: "screenshots/11_settings_app.png", title: "Settings — App", cat: "settings", catLabel: "SETTINGS", desc: "App settings — run management, data tools, changelog, dev tools, danger zone" },
  { id: 12, file: "screenshots/12_changelog_dialog.png", title: "Changelog Dialog", cat: "settings", catLabel: "SETTINGS", desc: "Version history dialog showing recent updates and bug fixes" },
  { id: 13, file: "screenshots/13_multiplayer_lobby.png", title: "Multiplayer Lobby", cat: "multiplayer", catLabel: "MULTIPLAYER", desc: "Multiplayer session lobby — host/join, nearby connections, player slots" },
  { id: 14, file: "screenshots/14_run_options_popup.png", title: "Run Options Popup", cat: "run", catLabel: "ACTIVE RUN", desc: "Quick-access popup menu — Favourites, Codex, Gunfortuna Dice, Reset Items, Save Run, End Run, Settings" },
  { id: 15, file: "screenshots/15_codex.png", title: "Codex", cat: "codex", catLabel: "CODEX", desc: "Codex screen — challenge modes, boss guides, special character info" },
  { id: 16, file: "screenshots/16_gunfortuna_dice.png", title: "Gunfortuna Dice Roll", cat: "run", catLabel: "ACTIVE RUN", desc: "Animated dice roll dialog intro — Gunfortuna's celestial bullet-goddess of chance" },
  { id: 17, file: "screenshots/17_dice_roll_result.png", title: "Dice Roll — Spinning", cat: "run", catLabel: "ACTIVE RUN", desc: "Dice spin animation — tap each die to stop its spin, current sum tracked live" },
  { id: 18, file: "screenshots/18_dice_final_result.png", title: "Dice Roll — Final Result", cat: "run", catLabel: "ACTIVE RUN", desc: "Gunfortuna declares your fate — final dice values and total score revealed" },
  { id: 19, file: "screenshots/19_effects_panel.png", title: "Effects Panel", cat: "run", catLabel: "ACTIVE RUN", desc: "Active effects panel — shows current active item effects, buffs, and debuffs on the run" },
  { id: 20, file: "screenshots/20_damage_calculator.png", title: "Damage Calculator", cat: "run", catLabel: "ACTIVE RUN", desc: "Damage calculator panel — compute damage output with modifiers and stats" },
  { id: 21, file: "screenshots/21_gun_detail.png", title: "Gun Detail", cat: "browse", catLabel: "BROWSE", desc: "Detailed gun view — BSG with full stats, DPS, damage, range, reload, type, synergies" },
  { id: 22, file: "screenshots/22_favourites.png", title: "Browse — Favourites Tab", cat: "browse", catLabel: "BROWSE", desc: "Favourites tab in browse — empty state with hint to tap heart on items/guns" },
  { id: 23, file: "screenshots/23_my_favourites.png", title: "My Favourites (Run Options)", cat: "run", catLabel: "ACTIVE RUN", desc: "Favourites page from run options — starred guns and items for quick access during runs" },
  { id: 24, file: "screenshots/24_codex_main.png", title: "Codex — Main View", cat: "codex", catLabel: "CODEX", desc: "Codex main screen — entry point to challenge modes and special content" },
  { id: 25, file: "screenshots/25_dev_tools.png", title: "Dev Tools — Special Items", cat: "settings", catLabel: "SETTINGS", desc: "Dev tools panel — add special items & guns (Gunderfury, Triple Gun, Evolver, Ser Junkan, etc.)" },
  { id: 26, file: "screenshots/26_event_log.png", title: "Event Log", cat: "settings", catLabel: "SETTINGS", desc: "Run event log — tracks pickups, shrine uses, and other run events with timestamps" },
  { id: 27, file: "screenshots/27_theme_picker_unicorn.png", title: "Theme Picker (Unicorn)", cat: "settings", catLabel: "SETTINGS", desc: "Unicorn theme selected — pink/purple palette with Unicorn Sparkles particle preset" },
  { id: 28, file: "screenshots/28_particle_studio.png", title: "Particle Studio (Expanded)", cat: "settings", catLabel: "SETTINGS", desc: "Expanded Particle Studio — fine-tune particle count, size, opacity, glow, line links, edge bounce" },
];

const catColors = {
  home: 'var(--accent)',
  character: 'var(--gold)',
  run: 'var(--cyan)',
  browse: 'var(--green)',
  settings: 'var(--pink)',
  codex: 'var(--accent)',
  multiplayer: 'var(--gold)',
};

const grid = document.getElementById('grid');
let currentFilter = 'all';
let currentLightbox = 0;
let filteredScreens = [];

function renderGrid() {
  filteredScreens = currentFilter === 'all' ? screens : screens.filter(s => s.cat === currentFilter);
  grid.innerHTML = filteredScreens.map((s, i) => `
    <div class="card" onclick="openLightbox(${i})" data-cat="${s.cat}">
      <div class="card-image">
        <img src="${s.file}" alt="${s.title}" loading="lazy">
        <div class="card-overlay" style="color: ${catColors[s.cat]}">${s.catLabel}</div>
      </div>
      <div class="card-body">
        <div class="card-number">SCREEN ${String(s.id).padStart(2, '0')}</div>
        <div class="card-title">${s.title}</div>
        <div class="card-desc">${s.desc}</div>
      </div>
    </div>
  `).join('');
}

function openLightbox(index) {
  currentLightbox = index;
  updateLightbox();
  document.getElementById('lightbox').classList.add('active');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
}

function navLightbox(dir) {
  currentLightbox = (currentLightbox + dir + filteredScreens.length) % filteredScreens.length;
  updateLightbox();
}

function updateLightbox() {
  const s = filteredScreens[currentLightbox];
  document.getElementById('lightbox-img').src = s.file;
  document.getElementById('lightbox-title').textContent = s.title;
  document.getElementById('lightbox-desc').textContent = s.desc;
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderGrid();
  });
});

// Keyboard nav
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(-1);
  if (e.key === 'ArrowRight') navLightbox(1);
});

// Click outside to close
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') closeLightbox();
});

renderGrid();
</script>

</body>
</html>
